name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  # Full gate on macOS: strict benchmarks + release build + screenshot smoke test.
  # The native Cocoa/CoreText window and headless screenshots only run here.
  test-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Strict gate (tests + microsecond benchmarks)
        run: zig build test -Doptimize=ReleaseFast --summary all
      - name: Release build
        run: zig build -Doptimize=ReleaseFast
      - name: Binary size budget (ship binary, see AGENTS.md §1)
        run: ./scripts/size_gate.sh zig-out/bin/read
      - name: Ship/test separation (no hooks in ship binary, see AGENTS.md §1)
        run: sh scripts/ship_separation.sh ./zig-out/bin/read ./zig-out/bin/read-test showcase.md
      - name: Screenshot smoke test (testing binary carries the headless CLI)
        run: ./zig-out/bin/read-test --screenshot /tmp/smoke.png showcase.md && ls -lh /tmp/smoke.png
      - name: Damage parity (selection records under partial redraws)
        run: sh scripts/damage_parity.sh ./zig-out/bin/read-test showcase.md

  # Portability check: core tests + build must also pass on Linux.
  # (Cocoa frameworks link only on Darwin; see build.zig.)
  test-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Strict gate (tests + microsecond benchmarks)
        run: zig build test -Doptimize=ReleaseFast --summary all
      - name: Release build
        run: zig build -Doptimize=ReleaseFast
