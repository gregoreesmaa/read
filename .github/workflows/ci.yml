name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  # Platform-seam gate (issue #53, docs/cross-platform-rfc.md §6): src/core
  # and src/layout are OS-agnostic. Every platform-ism lives behind the
  # bridge.zig/platform.h boundary in src/platform + src/main.zig (app
  # shell). Needs no toolchain; runs everywhere, fails on any match.
  # NOTE: patterns anchor on real API spellings (XOpenDisplay, FT_New_Face,
  # FcFontMatch, IDWriteFactory, CreateWindowEx, ...) — bare X[A-Z]/FT_
  # classes false-positive on contentXOf/NONEXISTENT_TOKEN.
  seam-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No platform symbols outside the seam
        run: |
          if grep -rnE '(^|[^A-Za-z0-9_])NS[A-Z][A-Za-z]|AppKit|Cocoa|CoreText|CoreGraphics|CoreFoundation|NSString|NSURL|NSFont|CTFont|CTLine|CGContext|CGImage|dispatch_async|XOpenDisplay|XCreateWindow|XShm|FT_Init|FT_New_Face|FcInit|FcFontMatch|IDWrite|CreateWindowEx|RegisterClass|HBITMAP|Gdip[A-Z]' src/core src/layout; then
            echo 'FAIL: platform symbol outside src/platform (see docs/cross-platform-rfc.md §6)'
            exit 1
          fi
          echo 'PASS: seam clean'

  # Full gate on macOS: strict benchmarks + release build + screenshot smoke test.
  # The native Cocoa/CoreText window and headless screenshots only run here.
  test-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      # Wall-clock microsecond gates enforce on stable hardware only (see
      # simd.timingBudgetsEnforced): shared CI VMs measure neighbor
      # contention as much as code, so CI runs the same tests with prints
      # but without wall-clock asserts. Thresholds are byte-identical;
      # local pre-commit runs still gate.
      - name: Strict gate (tests + microsecond benchmarks)
        run: zig build test -Doptimize=ReleaseFast --summary all
      - name: Parser short fuzz (malformed + huge inputs, issue #34)
        run: sh scripts/fuzz_parser.sh
      - name: Math test-double (scripted libzatex_test when a zatex checkout is present, issue #378)
        run: sh scripts/math_testdouble.sh
      - name: Math parity harness (host-parity corpus when vendored, local otherwise, issue #381)
        run: sh scripts/math_parity.sh ./zig-out/bin/read-test
      - name: Release build
        run: zig build -Doptimize=ReleaseFast
      - name: Binary size budget (ship binary, see AGENTS.md §1)
        run: ./scripts/size_gate.sh zig-out/bin/read
      - name: App bundle (icon + plist, issue #102)
        run: |
          sh scripts/make_app_bundle.sh zig-out/bin/read /tmp/ReadApp 0.0.0-ci
          sh scripts/check_app_bundle.sh /tmp/ReadApp/Read.app
      - name: Ship/test separation (no hooks in ship binary, see AGENTS.md §1)
        run: sh scripts/ship_separation.sh ./zig-out/bin/read ./zig-out/bin/read-test showcase.md
      - name: Screenshot smoke test (testing binary carries the headless CLI)
        run: ./zig-out/bin/read-test --screenshot /tmp/smoke.png showcase.md && ls -lh /tmp/smoke.png
      - name: Damage parity (selection records under partial redraws)
        run: sh scripts/damage_parity.sh ./zig-out/bin/read-test showcase.md
      - name: Render short fuzz (scroll/select/drag/damage/scale/atlas oracles)
        run: ./scripts/fuzz_render.sh ./zig-out/bin/read-test showcase.md 2
      - name: test_cases discipline (exactly 1 scrollable-doc case)
        run: sh scripts/check_test_cases.sh
      - name: Screenshot suite (visual regression captures)
        run: ./scripts/screenshot_suite.sh screenshots
      - name: Attach screenshots to the run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots/
          retention-days: 14

  # Portability check: core tests + build must also pass on Linux.
  # (The X11 backend links there too; see build.zig.)
  test-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Install X11/FreeType/fontconfig/libpng dev packages
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxext-dev libfontconfig1-dev libfreetype6-dev libpng-dev xvfb
      - name: Strict gate (tests + microsecond benchmarks)
        run: zig build test -Doptimize=ReleaseFast --summary all
      - name: Parser short fuzz (malformed + huge inputs, issue #34)
        run: sh scripts/fuzz_parser.sh
      - name: test_cases discipline (exactly 1 scrollable-doc case)
        run: sh scripts/check_test_cases.sh
      - name: Release build
        run: zig build -Doptimize=ReleaseFast
      - name: Binary size budget (ship binary, see AGENTS.md §1)
        run: ./scripts/size_gate.sh zig-out/bin/read
      - name: Ship/test separation (no hooks in ship binary, see AGENTS.md §1)
        run: sh scripts/ship_separation.sh ./zig-out/bin/read ./zig-out/bin/read-test showcase.md
      - name: Screenshot smoke test (headless, under Xvfb for fontconfig)
        run: xvfb-run -a ./zig-out/bin/read-test --screenshot /tmp/smoke.png showcase.md && ls -lh /tmp/smoke.png

  # Windows portability: full test suite + release build must pass here.
  # (The Win32 backend links there; see build.zig.)
  test-windows:
    runs-on: windows-2022
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Strict gate (tests + microsecond benchmarks)
        run: zig build test -Doptimize=ReleaseFast --summary all
      - name: Parser short fuzz (malformed + huge inputs, issue #34)
        run: sh scripts/fuzz_parser.sh
      - name: test_cases discipline (exactly 1 scrollable-doc case)
        run: sh scripts/check_test_cases.sh
      - name: Release build
        run: zig build -Doptimize=ReleaseFast
      - name: Build pesize helper (PE .text reader for the size gate)
        run: zig build-exe scripts/pesize.zig -O ReleaseSmall -lc -femit-bin="$RUNNER_TEMP/pesize.exe"
      - name: Binary size budget (ship binary, see AGENTS.md §1)
        env:
          PESIZE: ${{ runner.temp }}/pesize.exe
        run: ./scripts/size_gate.sh zig-out/bin/read.exe
      - name: Screenshot smoke test (headless, no display server needed)
        run: ./zig-out/bin/read-test.exe --screenshot "$RUNNER_TEMP/smoke.png" showcase.md && ls -lh "$RUNNER_TEMP/smoke.png"
